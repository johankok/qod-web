name: Build, Scan, and Publish Image

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Mondays 04:00 UTC) to pick up base image updates
    - cron: '0 4 * * 1'

env:
  IMAGE_NAME: qod-web
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # Scheduled rebuilds only refresh `latest`, so the per-commit SHA tags stay immutable
  IMAGE_TAGS: ${{ github.event_name == 'schedule' && 'latest' || format('latest {0}', github.sha) }}

jobs:
  build-scan-push:
    name: Build, scan and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image with Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          containerfiles: |
            ./Containerfile

      - name: Export image for scanning
        run: podman save --format docker-archive -o image.tar ${{ steps.build-image.outputs.image-with-tag }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Report-only by default; flip to '1' to fail the build on findings.
          exit-code: '0'

      - name: Upload Trivy scan results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        id: push-image
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push-image.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$REGISTRY_USER" --password-stdin
          cosign sign --yes "$IMAGE_REF"

      - name: Verify image signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push-image.outputs.digest }}
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/build-scan-push\.yml@"

      - name: Print image reference
        if: github.event_name != 'pull_request'
        run: echo "Pushed and signed ${{ steps.push-image.outputs.registry-path }}"
